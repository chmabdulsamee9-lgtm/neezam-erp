<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eNeezam</title>
    <script>
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('neezam_theme') || 'light'); } catch (e) {}
    </script>
    <style>
      html{background:#070A1A}
      html[data-theme="light"]{background:#F4F5FB}
      .nb-shell{display:flex;width:100%;height:100dvh}
      .nb-side{width:240px;flex-shrink:0;background:#0A0E26}
      .nb-main{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px}
      .nb-row{display:flex;gap:12px;flex-wrap:wrap}
      .nb-b{background:#222A5C;border-radius:8px;animation:nb-pulse 1.4s ease-in-out infinite}
      html[data-theme="light"] .nb-b{background:#D3D8EA}
      @keyframes nb-pulse{0%,100%{opacity:.6}50%{opacity:1}}
      @media (max-width:768px){.nb-side{display:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nb-shell" aria-busy="true">
        <div class="nb-side"></div>
        <div class="nb-main">
          <div class="nb-b" style="height:36px;width:40%"></div>
          <div class="nb-row">
            <div class="nb-b" style="height:80px;flex:1 1 160px"></div>
            <div class="nb-b" style="height:80px;flex:1 1 160px"></div>
            <div class="nb-b" style="height:80px;flex:1 1 160px"></div>
            <div class="nb-b" style="height:80px;flex:1 1 160px"></div>
          </div>
          <div class="nb-b" style="height:240px"></div>
          <div class="nb-b" style="height:160px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
